<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap');

  :root{
    --bg-a: #1b1440;
    --bg-b: #0d0a24;
    --card-bg: rgba(255,255,255,0.05);
    --card-border: rgba(255,255,255,0.10);
    --pill-bg: rgba(255,255,255,0.05);
    --pill-border: rgba(255,255,255,0.09);
    --pill-hover: rgba(255,255,255,0.09);
    --square-bg: rgba(255,255,255,0.05);
    --square-border: rgba(255,255,255,0.09);
    --top-btn-bg: rgba(255,255,255,0.08);
    --top-btn-border: rgba(255,255,255,0.14);
    --text: #f3f2fb;
    --muted: #a8adc9;
    --date-color: #9a9fc0;
    --icon-color: #d7d9ec;
    --ring-color: #4f7dfb;
    --name-grad-1: #a78bfa;
    --name-grad-2: #4f7dfb;
    --divider: rgba(255,255,255,0.10);
    --accent: #4f7dfb;
  }

  html[data-theme="light"]{
    --bg-a: #fdf3e3;
    --bg-b: #eaf3fb;
    --card-bg: rgba(255,255,255,0.65);
    --card-border: rgba(17,24,45,0.08);
    --pill-bg: rgba(255,255,255,0.55);
    --pill-border: rgba(17,24,45,0.08);
    --pill-hover: rgba(255,255,255,0.9);
    --square-bg: rgba(255,255,255,0.55);
    --square-border: rgba(17,24,45,0.08);
    --top-btn-bg: rgba(255,255,255,0.7);
    --top-btn-border: rgba(17,24,45,0.1);
    --text: #1c2333;
    --muted: #6b7280;
    --date-color: #7a8296;
    --icon-color: #384156;
    --ring-color: #4f7dfb;
    --name-grad-1: #7c3aed;
    --name-grad-2: #2563eb;
    --divider: rgba(17,24,45,0.10);
    --accent: #4f7dfb;
  }

  *{ box-sizing: border-box; }
  html,body{ height:100%; }

  body{
    margin:0;
    background:
      radial-gradient(circle at 20% 0%, var(--bg-a) 0%, transparent 55%),
      radial-gradient(circle at 85% 100%, var(--bg-b) 0%, transparent 55%),
      linear-gradient(160deg, var(--bg-a), var(--bg-b));
    color: var(--text);
    font-family: 'Inter', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px 16px;
    overflow-x: hidden;
    transition: background 0.4s ease, color 0.4s ease;
  }

  .page{
    position: relative;
    width: 100%;
    max-width: 380px;
  }

  .top-row{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    margin-bottom: 6px;
  }

  .clock-block{
    text-align: center;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
    animation-delay: 0.1s;
  }

  .clock{
    font-family:'Space Mono', monospace;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--text);
    line-height: 1.1;
    text-align: center;
  }
  .date{
    font-family:'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--date-color);
    margin-top: 6px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    text-align: center;
  }

  .top-actions{
    position: fixed;
    top: 20px;
    right: 20px;
    display:flex;
    flex-direction: column;
    gap: 10px;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
    animation-delay: 0.15s;
    z-index: 20;
  }

  .icon-btn{
    width: 46px;
    height: 46px;
    border-radius: 14px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--top-btn-bg);
    border: 1px solid var(--top-btn-border);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 8px 20px -8px rgba(0,0,0,0.35);
    color: var(--icon-color);
    cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
  }
  .icon-btn:hover{
    transform: translateY(-2px);
    border-color: var(--accent);
  }
  .icon-btn svg{ width:20px; height:20px; }

  @media (max-width: 420px){
    .top-actions{
      top: 14px;
      right: 14px;
    }
    .icon-btn{
      width: 42px;
      height: 42px;
    }
  }

  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .card{
    margin-top: 22px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 22px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    padding: 34px 24px 22px;
    text-align: center;
    box-shadow: 0 30px 70px -30px rgba(0,0,0,0.5);
    opacity: 0;
    transform: translateY(18px);
    animation: rise 0.7s cubic-bezier(.19,1,.22,1) forwards;
    animation-delay: 0.2s;
  }
  @keyframes rise{
    to{ opacity:1; transform: translateY(0); }
  }

  .avatar-wrap{
    position: relative;
    width: 96px;
    height: 96px;
    margin: 0 auto 20px;
  }
  .avatar-ring{
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 3px solid var(--ring-color);
    box-shadow: 0 0 0 4px rgba(79,125,251,0.12);
  }
  .avatar{
    width: 96px;
    height: 96px;
    border-radius: 50%;
    object-fit: cover;
    display:block;
  }

  h1{
    font-family:'Inter', sans-serif;
    font-size: 28px;
    font-weight: 800;
    margin: 0 0 14px;
    letter-spacing: 0.2px;
    background: linear-gradient(90deg, var(--name-grad-1), var(--name-grad-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .role{
    font-family:'Space Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    min-height: 18px;
    margin-bottom: 20px;
  }
  .role .cursor{
    display:inline-block;
    width: 2px;
    height: 13px;
    background: var(--accent);
    margin-left: 2px;
    vertical-align: middle;
    animation: blink 0.9s step-end infinite;
  }
  @keyframes blink{
    0%,100%{ opacity:1; }
    50%{ opacity:0; }
  }

  .links{
    display:flex;
    flex-direction:column;
    gap: 12px;
    margin-bottom: 22px;
  }

  .link{
    display:flex;
    align-items:center;
    gap: 14px;
    padding: 15px 18px;
    background: var(--pill-bg);
    border: 1px solid var(--pill-border);
    border-radius: 100px;
    color: var(--text);
    text-decoration:none;
    font-size: 15px;
    font-weight: 600;
    transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
  }
  .link:hover{
    background: var(--pill-hover);
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  .link svg{
    width: 20px;
    height: 20px;
    color: var(--icon-color);
    flex-shrink: 0;
  }

  .divider{
    border: none;
    border-top: 1px solid var(--divider);
    margin: 20px 0 18px;
  }

  .squares{
    display:flex;
    justify-content:center;
    gap: 12px;
  }
  .squares a{
    width: 58px;
    height: 58px;
    border-radius: 16px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--square-bg);
    border: 1px solid var(--square-border);
    color: var(--icon-color);
    text-decoration:none;
    transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .squares a:hover{
    transform: translateY(-2px);
    border-color: var(--accent);
    background: var(--pill-hover);
  }
  .squares svg{ width:22px; height:22px; }

  footer{
    text-align:center;
    font-family:'Inter', sans-serif;
    font-size: 11px;
    color: var(--muted);
    padding: 18px 0 4px;
  }

  .share-overlay{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 50;
  }
  .share-overlay.show{
    opacity: 1;
    pointer-events: auto;
  }
  .share-sheet{
    width: 100%;
    max-width: 380px;
    background: var(--bg-b);
    border: 1px solid var(--card-border);
    border-radius: 22px 22px 0 0;
    padding: 20px 20px 26px;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(.19,1,.22,1);
  }
  .share-overlay.show .share-sheet{
    transform: translateY(0);
  }
  .share-sheet h3{
    margin: 0 0 16px;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    text-align:center;
  }
  .share-grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 10px;
  }
  .share-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 8px;
    text-decoration:none;
    background:none;
    border:none;
    cursor:pointer;
    font-family:'Inter', sans-serif;
  }
  .share-item .ic{
    width: 50px;
    height: 50px;
    border-radius: 16px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--pill-bg);
    border: 1px solid var(--pill-border);
    color: var(--icon-color);
  }
  .share-item .ic svg{ width:24px; height:24px; }
  .share-item span{
    font-size: 11px;
    color: var(--muted);
    text-align:center;
  }
  .share-cancel{
    display:block;
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    border-radius: 14px;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    color: var(--text);
    font-family:'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }

  .toast{
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: var(--bg-b);
    font-family:'Inter', sans-serif;
    font-weight: 600;
    font-size: 12px;
    padding: 10px 18px;
    border-radius: 100px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 10;
  }
  .toast.show{
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>

<script>
  const hariList = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  const bulanList = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

  function tick(){
    const now = new Date();
    const jam = String(now.getHours()).padStart(2,'0');
    const menit = String(now.getMinutes()).padStart(2,'0');
    const detik = String(now.getSeconds()).padStart(2,'0');
    document.getElementById('clock').textContent = `${jam}:${menit}:${detik}`;
    document.getElementById('date').textContent =
      `${hariList[now.getDay()]}, ${now.getDate()} ${bulanList[now.getMonth()]} ${now.getFullYear()}`;
  }
  tick();
  setInterval(tick, 1000);

  // efek mengetik bergantian
  const roles = ['Creator Bot', 'Content Creator', 'Digital Creator'];
  const typedEl = document.getElementById('typedRole');
  let roleIndex = 0, charIndex = 0, deleting = false;

  function typeLoop(){
    const current = roles[roleIndex];

    if(!deleting){
      charIndex++;
      typedEl.textContent = current.slice(0, charIndex);
      if(charIndex === current.length){
        deleting = true;
        setTimeout(typeLoop, 1400);
        return;
      }
      setTimeout(typeLoop, 65);
    } else {
      charIndex--;
      typedEl.textContent = current.slice(0, charIndex);
      if(charIndex === 0){
        deleting = false;
        roleIndex = (roleIndex + 1) % roles.length;
        setTimeout(typeLoop, 300);
        return;
      }
      setTimeout(typeLoop, 35);
    }
  }
  typeLoop();

  // toggle mode terang / gelap
  const themeToggle = document.getElementById('themeToggle');
  const themeIcon = document.getElementById('themeIcon');
  const htmlEl = document.documentElement;

  const moonPath = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';

  function renderThemeIcon(theme){
    if(theme === 'dark'){
      themeIcon.setAttribute('fill', 'currentColor');
      themeIcon.removeAttribute('stroke');
      themeIcon.removeAttribute('stroke-width');
      themeIcon.removeAttribute('stroke-linecap');
      themeIcon.removeAttribute('stroke-linejoin');
      themeIcon.innerHTML = moonPath;
    } else {
      themeIcon.setAttribute('fill', 'none');
      themeIcon.setAttribute('stroke', 'currentColor');
      themeIcon.setAttribute('stroke-width', '2');
      themeIcon.setAttribute('stroke-linecap', 'round');
      themeIcon.setAttribute('stroke-linejoin', 'round');
      themeIcon.innerHTML = '<circle cx="12" cy="12" r="4"></circle><line x1="12" y1="1.5" x2="12" y2="3.5"></line><line x1="12" y1="20.5" x2="12" y2="22.5"></line><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"></line><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"></line><line x1="1.5" y1="12" x2="3.5" y2="12"></line><line x1="20.5" y1="12" x2="22.5" y2="12"></line><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"></line><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"></line>';
    }
  }

  themeToggle.addEventListener('click', () => {
    const isDark = htmlEl.getAttribute('data-theme') === 'dark';
    const next = isDark ? 'light' : 'dark';
    htmlEl.setAttribute('data-theme', next);
    renderThemeIcon(next);
  });

  // fitur bagikan
  const shareBtn = document.getElementById('shareBtn');
  const toast = document.getElementById('toast');

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
  }

  const shareOverlay = document.getElementById('shareOverlay');
  const shareCancel = document.getElementById('shareCancel');
  const shareCopy = document.getElementById('shareCopy');
  const shareWhatsapp = document.getElementById('shareWhatsapp');
  const shareTelegram = document.getElementById('shareTelegram');
  const shareFacebook = document.getElementById('shareFacebook');

  function openShareSheet(){
    const url = window.location.href;
    const text = 'Lihat portfolio Rizki!';
    shareWhatsapp.href = `https://wa.me/?text=${encodeURIComponent(text + ' ' + url)}`;
    shareTelegram.href = `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`;
    shareFacebook.href = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`;
    shareOverlay.classList.add('show');
  }
  function closeShareSheet(){
    shareOverlay.classList.remove('show');
  }

  shareBtn.addEventListener('click', openShareSheet);
  shareCancel.addEventListener('click', closeShareSheet);
  shareOverlay.addEventListener('click', (e) => {
    if(e.target === shareOverlay) closeShareSheet();
  });

  shareCopy.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(window.location.href);
      showToast('Tautan disalin!');
    } catch (err) {
      showToast('Gagal menyalin tautan');
    }
    closeShareSheet();
  });
</script>

</body>
</html>
